name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    # 自检只用 Windows 自带的 bcrypt.dll，不需要装任何依赖
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 在 GitHub 的 windows runner 上安装经常被取消，所以从 3.11 起测
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 离线自检（不读微信、不联网）
        run: python main.py --selftest

      - name: unittest
        run: python -m unittest discover -s tests -v

      - name: 语法检查
        run: python -m compileall -q wxexport main.py
